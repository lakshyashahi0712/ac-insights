<!-- popup/popup.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-header">
    <h1>📊 AC Insights</h1>
  </div>
  <select id="course-select" class="hidden" aria-label="Select course"></select>
  <div id="popup-content">
    <p class="hint">Open an Apna College course page to see analytics.</p>
  </div>

  <div class="setting-row">
    <label class="setting-label" for="autonext-toggle">
      <span class="setting-title">⏭️ Block auto-next</span>
      <span class="setting-desc">Pause at the end instead of jumping to the next video</span>
    </label>
    <label class="switch">
      <input type="checkbox" id="autonext-toggle">
      <span class="switch-slider"></span>
    </label>
  </div>

  <button id="show-bookmarks-btn">🔖 View Bookmarks</button>
  <button id="show-summary-btn">Show Full Summary</button>
  <script src="popup.js"></script>
</body>
</html>
